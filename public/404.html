<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Simpan path asli, redirect ke root dengan path sebagai query param
      const path = window.location.pathname;
      window.location.replace('/?redirect=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
